# V1.87: ALLE Images sind per Digest gepinnt (Stand = auf Test-VM .182 getestet).
# Anheben: neuen Digest bewusst eintragen (docs/PINS.md), auf VM testen, releasen.
# V1.85: gemeinsame Log-Begrenzung fuer ALLE Dienste (vorher wuchsen die
# json-file-Logs unbegrenzt, main.py verweist auf dieses max-size).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # SRTLA-Relay (srtla_rec + SRT Live Server) UND NOALBS gebuendelt in einem
  # Image - siehe Plan-Entscheidung "NOALBS-Architektur". network_mode:host,
  # weil OBS auf demselben Host laeuft (config.json zeigt auf "localhost")
  # und srtla_rec/SLS ohnehin eigene UDP-Ports direkt binden wollen.
  belabox-receiver:
    image: kezzkezz/belabox@sha256:1aa8e9abcfd5e9c6d51ff5d70cc6ef966be9a4089e35b5ea06b9718c4f3b6dd2
    container_name: belabox-receiver
    logging: *default-logging
    network_mode: host
    privileged: true
    restart: unless-stopped
    # TZ=Europe/Berlin statt fest "CEST"/"UTC+2" (Nutzerwunsch 2026-09-02):
    # eine feste Offset-Angabe waere im Winter falsch (dann CET/UTC+1) -
    # "Europe/Berlin" kennt ueber die eingebaute tzdata-Datenbank die
    # jaehrlich wechselnden Umstellungstermine automatisch, kein manuelles
    # Nachpflegen bei der Zeitumstellung noetig. Zusaetzlich /etc/localtime
    # vom Host gemountet als Absicherung fuer Images, deren Software die
    # TZ-Variable NICHT selbst respektiert (z.B. manche C-Programme, die
    # nur /etc/localtime lesen, nicht die Umgebungsvariable). Betrifft nur
    # die ANZEIGE von Zeitstempeln (Logs) - die tatsaechliche Uhrzeit war
    # ueber network_mode:host ohnehin schon korrekt (geteilter Kernel-Takt
    # mit dem Host, der bereits per systemd-timesyncd/NTP synchron laeuft).
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./belabox/config.json:/app/config.json:rw
      - ./belabox/.env:/app/.env:rw
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

  # Bestehendes IRL-Diagnostics-Dashboard (siehe
  # /home/jo/ki-agent-server/irl-diagnostics), hier im "local_docker"-Modus
  # (main.py NOALBS_MODE=local_docker) - steuert belabox-receiver direkt per
  # Docker-Socket statt per SSH auf eine separate NOALBS-VM.
  irl-diagnostics:
    build: ./irl-diagnostics-src
    container_name: irl-diagnostics
    logging: *default-logging
    network_mode: host
    restart: unless-stopped
    env_file:
      - ./irl-diagnostics.env
    environment:
      TZ: Europe/Berlin
      # V1.85: KEIN Docker-Socket mehr im Container (auch ":ro" erlaubte die
      # komplette Docker-API = root auf dem Host). Zugriff nur noch ueber den
      # Whitelist-Proxy unten (containers get/inspect/logs/restart, exec).
      DOCKER_HOST: tcp://127.0.0.1:2375
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8300/healthz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    mem_limit: 512m
    pids_limit: 256
    volumes:
      - ./irl-diagnostics-data:/app/data
      - ./belabox/config.json:/app/belabox-config.json:rw
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # Lizenzstatus-Anzeige im Dashboard (siehe _check_license() in main.py):
      # read-only, das Dashboard soll die Lizenzdatei/Skripte niemals selbst
      # veraendern - das bleibt allein Aufgabe von license-daily-check.sh
      # und license-client.sh (laufen als systemd-Timer auf dem Host, nicht
      # im Container).
      - /opt/irl-streamer-os:/opt/irl-streamer-os:ro
      # Lizenz-"Tresor" (Haertung 2026-09-05, siehe license-vault-init.sh):
      # liegt BEWUSST ausserhalb von /opt/irl-streamer-os, damit er nicht
      # ueber den offensichtlichen Projektordner auffindbar ist - muss
      # deshalb separat gemountet werden, sonst kann _check_license() den
      # Resolver/die Tresor-Dateien im Container nicht mehr lesen. Ebenfalls
      # read-only, aus demselben Grund wie oben.
      - /opt/.intel-mediasdk-cache:/opt/.intel-mediasdk-cache:ro
      # Host-Control (Nutzerwunsch 07.09.2026: OBS-Notfallknopf + PC-
      # Neustart-Knopf) - bewusst READ-WRITE, im Gegensatz zu den beiden
      # Mounts oben: der Container schreibt hier Trigger-Dateien, der
      # root-systemd-Dienst irl-streamer-host-control.service (laeuft
      # DIREKT auf dem Host, siehe provision/assets/) beobachtet denselben
      # Ordner und fuehrt die eigentliche privilegierte Aktion
      # (OBS-Start/-Stop, echter Host-Reboot) aus - der Container selbst
      # bekommt dadurch NIE echte Root-Rechte auf dem Host, nur die
      # Faehigkeit, um genau diese drei vordefinierten Aktionen zu bitten.
      - /var/lib/irl-streamer-host-control:/host-control
    depends_on:
      - belabox-receiver
      - docker-socket-proxy

  # V1.85: Docker-API-Whitelist fuer das Dashboard (tecnativa, feste Version).
  # Erlaubt: /containers/* lesen (get/inspect/logs), POST (fuer exec create +
  # restart), /exec/* (exec start), restart/stop/kill (ALLOW_RESTARTS),
  # /version + /_ping (Image-Default). Alles andere (images, volumes, build,
  # networks, system, container create ...) liefert 403. Eigenes Bridge-Netz,
  # Port nur auf 127.0.0.1 veroeffentlicht - nicht im LAN/Relay erreichbar.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    container_name: docker-socket-proxy
    logging: *default-logging
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      EXEC: "1"
      POST: "1"
      ALLOW_RESTARTS: "1"
      ALLOW_START: "0"
      ALLOW_STOP: "0"
      IMAGES: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      BUILD: "0"
      SYSTEM: "0"
      INFO: "0"
      EVENTS: "0"
      AUTH: "0"
      SECRETS: "0"
      SERVICES: "0"
      TASKS: "0"
      SWARM: "0"
      NODES: "0"
      PLUGINS: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      SESSION: "0"
      COMMIT: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:2375:2375"
    mem_limit: 64m
    pids_limit: 64

  # Phase 3: Guacamole (nur der Container - Erreichbarkeit von aussen bleibt
  # bewusst Nutzer-Territorium, siehe [[user_network_engineer]]). Seit
  # 2026-08-31 mit PostgreSQL-Datenbank statt der urspruenglich einfacheren
  # dateibasierten user-mapping.xml (siehe Kommentar bei guacamole-db unten)
  # - Nutzerwunsch, um Verbindungen ueber die Weboberflaeche verwalten zu
  # koennen.
  guacd:
    image: guacamole/guacd@sha256:2d266a525a72ad55d8ea7cd4ca8342a1b44075759b03660d8684821b3636a922
    container_name: guacd
    logging: *default-logging
    # V1.85: guacd (ohne eigene Authentifizierung) nur auf localhost statt
    # 0.0.0.0:4822. Guacamole erreicht ihn weiter ueber GUACD_HOSTNAME=localhost.
    # Entrypoint MUSS ueberschrieben werden: das Image-entrypoint.sh ruft fest
    # "guacd -f -b 0.0.0.0 ... $@" auf - ein zusaetzliches -b in command wird
    # von guacd ignoriert (live auf VM .182 verifiziert, lauschte weiter auf 0.0.0.0).
    entrypoint: ["/opt/guacamole/sbin/guacd"]
    command: ["-b", "127.0.0.1", "-L", "info", "-f"]
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # guacamole/guacd ist ebenfalls Alpine-basiert (siehe caddy:2-alpine-
      # Kommentar weiter unten) - trotz korrekt gemountetem /etc/localtime
      # UND /etc/timezone blieb "date" hier live bei UTC (2026-09-02
      # verifiziert), weil die eigentliche Zoneinfo-Datenbank fehlt.
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro

  # PostgreSQL-Datenbank fuer Guacamole (Nutzerwunsch 2026-08-31): ersetzt
  # die vorherige dateibasierte user-mapping.xml-Authentifizierung, die
  # zwar simpler war (kein zusaetzlicher Container), aber KEINE Bearbeitung
  # von Verbindungen ueber die Weboberflaeche erlaubte - auch nicht als
  # Admin, das ist eine grundsaetzliche Einschraenkung dieser einfachen
  # Betriebsart, kein Bug. Mit Datenbank: volle Verwaltungsoberflaeche
  # (Verbindungen anlegen/bearbeiten/loeschen, mehrere Benutzer, Rechte,
  # Verbindungsverlauf). PostgreSQL statt MySQL: leichter, offiziell von
  # Guacamole gleichwertig unterstuetzt.
  guacamole-db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: guacamole-db
    logging: *default-logging
    # V1.85: nur auf localhost lauschen (vorher 0.0.0.0:5432 im LAN/Relay).
    # Guacamole verbindet sich ueber POSTGRESQL_HOSTNAME=localhost.
    command: ["postgres", "-c", "listen_addresses=localhost"]
    network_mode: host
    restart: unless-stopped
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD_FILE: /run/secrets/guacamole_db_password
      PGPORT: "5432"
      TZ: Europe/Berlin
    volumes:
      - guacamole-db-data:/var/lib/postgresql/data
      - ./guacamole/postgresql-init:/docker-entrypoint-initdb.d:ro
      - ./guacamole/state/db-password.txt:/run/secrets/guacamole_db_password:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # postgres:16-alpine ist ebenfalls Alpine-basiert und hat denselben
      # fehlenden-tzdata-Effekt wie caddy:2-alpine (siehe dortiger
      # Kommentar) - Zoneinfo-Datenbank vom Host mitmounten, damit die
      # TZ-Variable tatsaechlich greift statt lautlos auf UTC zu bleiben.
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro

  guacamole:
    image: guacamole/guacamole@sha256:320b09e10e205fb16c4b80db0320e7d7022faff308c7eff11944fd963ba5daf6
    container_name: guacamole
    logging: *default-logging
    network_mode: host
    restart: unless-stopped
    environment:
      # V1.85: explizit IPv4, weil guacd nur noch auf 127.0.0.1 lauscht
      # ("localhost" koennte in Java zu ::1 aufgeloest werden).
      GUACD_HOSTNAME: 127.0.0.1
      POSTGRESQL_HOSTNAME: localhost
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USER: guacamole_user
      POSTGRESQL_PASSWORD_FILE: /run/secrets/guacamole_db_password
      TZ: Europe/Berlin
    volumes:
      - ./guacamole/state/db-password.txt:/run/secrets/guacamole_db_password:ro
      # V1.91: Dark-Theme + IRL-Logo als Branding-Extension (Quelle:
      # guacamole/branding/, gebaut mit build.py). Das Image fuer GUACAMOLE_HOME
      # (/etc/guacamole) verlinkt alles unter extensions/ automatisch.
      - ./guacamole/branding/guacamole-irl-theme.jar:/etc/guacamole/extensions/guacamole-irl-theme.jar:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      - guacd
      - guacamole-db

  # HTTPS-Reverse-Proxy vors Diagnose-Dashboard (Nutzerwunsch 2026-08-31):
  # Web Bluetooth (DJI-Kamera-Anbindung, siehe static/dji-ble-test.html)
  # verlangt zwingend einen "sicheren Kontext" (HTTPS oder localhost) -
  # das Dashboard wird aber sowohl direkt auf dem Mini-PC ALS AUCH von
  # Handys/Tablets im Netzwerk aus geoeffnet, wo "localhost" nicht
  # greift. Echtes Let's-Encrypt-Zertifikat ist fuer eine private
  # 192.168.x.x-Adresse technisch unmoeglich (keine oeffentliche
  # Erreichbarkeit pruefbar) - "tls internal" nutzt stattdessen Caddys
  # eigene, lokal generierte Root-CA. Diese muss einmalig pro Geraet
  # importiert werden (siehe provision.sh/INSTALLATION.md), danach
  # zeigt der Browser das normale Schloss-Symbol. main.py selbst bleibt
  # unveraendert (kennt kein TLS) - reiner Reverse-Proxy auf Port 8300.
  # Filebrowser (Nutzerwunsch 19.09.2026): Web-Datei-Uploader, damit der
  # Kunde ueber jeden Browser (Handy/Laptop/anderer PC) Dateien per
  # Drag&Drop auf diesen Mini-PC hochladen kann - unabhaengig von einer
  # laufenden Guacamole/RDP-Sitzung. Grund: GNOME Remote Desktop (der
  # RDP-Server dieses Mini-PCs, siehe Kommentar bei "Zwischenablage"
  # weiter unten) implementiert KEIN Drive-Redirection/rdpdr - Drag&Drop
  # direkt in die RDP-Sitzung ist deshalb technisch nicht moeglich, auch
  # mit einem originalen Windows-RDP-Client nicht (bestaetigt im
  # GNOME-eigenen Forum). Dieser Container ist der Ersatz dafuer.
  #
  # WICHTIG (Image-Wahl, 19.09.2026): NICHT das urspruengliche
  # "filebrowser/filebrowser" verwenden - dieses Projekt wurde am
  # 01.09.2026 vom Original-Maintainer offiziell archiviert ("no further
  # releases, bug fixes, or security fixes"), das eigene README raet
  # explizit davon ab, es direkt ohne eigene vorgeschaltete
  # Authentifizierung ans Internet zu haengen (bekannte, dauerhaft
  # ungepatchte Session/JWT-Schwaeche: Tokens koennen nicht widerrufen
  # werden). Dieses Projekt exponiert Filebrowser aber direkt oeffentlich
  # (siehe relay-provisioner filebrowser_public_port_for()) - daher
  # stattdessen "FileBrowser Quantum" (gtsteffaniak/filebrowser, aktiv
  # weiterentwickelter Fork, Docker-Image gtstef/filebrowser, Config
  # ueber config.yaml statt FB_*-Env-Variablen). network_mode:host wie
  # alle anderen Dienste hier.
  filebrowser:
    image: gtstef/filebrowser:stable@sha256:7c5d7ac8ffda31294d278063cf9d2e04303b39e6dce1f4c691342240ca7703b8
    container_name: filebrowser
    logging: *default-logging
    network_mode: host
    restart: unless-stopped
    # Fest ins Image gebackener Healthcheck prueft faelschlich Port 80
    # (Docker-Default), obwohl dieser Dienst hier bewusst auf 5013 laeuft
    # (siehe config.yaml.template) - ohne Override zeigt "docker ps" daher
    # dauerhaft "unhealthy", obwohl der Server einwandfrei funktioniert
    # (live verifiziert 19.09.2026: Login/Upload liefen trotzdem korrekt).
    # Eigener Healthcheck gegen den tatsaechlich konfigurierten Port, damit
    # der Status im Diagnose-Dashboard/bei "docker ps" nicht faelschlich
    # als Problem erscheint.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5013/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    environment:
      TZ: Europe/Berlin
    volumes:
      # config.yaml wird von provision.sh aus einem Template gerendert
      # (Admin-Passwort erst zur Laufzeit generiert, gleiches Muster wie
      # bei docker/belabox/config.json.template) - read-only in den
      # Container gemountet, der Container selbst soll sie nie
      # veraendern.
      - ./filebrowser/config.yaml:/home/filebrowser/data/config.yaml:ro
      # Datenbank (Nutzer/Sessions) MUSS beschreibbar UND persistent
      # sein - eigenes Volume statt Bind-Mount, analog zu
      # guacamole-db-data unten.
      - filebrowser-data:/home/filebrowser/data
      # Zielordner fuer hochgeladene Dateien: Home-Verzeichnis des Kunden,
      # eigener Unterordner (Nutzerentscheidung 19.09.2026) - NICHT das
      # komplette Home gemountet, damit der Kunde ueber die Weboberflaeche
      # nicht versehentlich an andere Konfigurationsdateien in seinem
      # Home-Verzeichnis kommt.
      - /home/streamer/IRL-Uploads:/srv
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # KEIN /usr/share/zoneinfo-Mount noetig (anders als bei den
      # Alpine-basierten Diensten oben) - das gtstef/filebrowser-Image
      # installiert tzdata bereits selbst im eigenen Dockerfile.

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: caddy
    logging: *default-logging
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # caddy:2-alpine bringt KEIN tzdata-Paket mit (Alpine-Images generell
      # nicht) - "TZ=Europe/Berlin" alleine loest den Zonennamen dadurch
      # nicht auf und faellt lautlos auf UTC zurueck (live gefunden
      # 2026-09-02: /etc/localtime-Mount allein reichte bei Caddy NICHT,
      # bei den anderen - nicht-Alpine-basierten - Diensten dagegen schon).
      # Fix: zusaetzlich die komplette Zoneinfo-Datenbank vom Host mounten,
      # damit Go's eigene time.LoadLocation("Europe/Berlin") sie findet -
      # jeder Linux-Host bringt /usr/share/zoneinfo bereits fertig mit,
      # kein zusaetzliches Paket auf dem Host noetig.
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    # /data/caddy/pki/authorities/local/root.crt ist der Pfad, unter dem
    # Caddy seine selbst generierte Root-CA ablegt - fuer den Download-
    # Endpunkt (siehe Caddyfile, /root-ca.crt) auf denselben Ort wie das
    # "data"-Volume gemappt, damit beide dieselbe Datei sehen.
    depends_on:
      - irl-diagnostics

volumes:
  caddy-data:
  caddy-config:
  guacamole-db-data:
  filebrowser-data:
