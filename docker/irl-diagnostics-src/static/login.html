<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnostic Board - Anmeldung</title>
<style>
  /* V1.91: Login im Stil des Guacamole-Dark-Themes - Logo (max. 400px) und Formular
     liegen auf EINER Mittelachse; Palette wie das Dashboard (index.html). */
  :root {
    --bg: #0b0d12; --surface-2: #171b25; --border: #262c3a; --border-strong: #333b4d;
    --text: #e8eaf0; --muted: #a3aabb; --bad: #ff6b6b; --accent: #5b8dff; --accent-hover: #7aa3ff;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; padding: 20px;
  }
  form {
    width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center;
  }
  .logo {
    --s: min(400px, 50vh, calc(100vw - 40px));
    width: var(--s); height: var(--s); display: block; object-fit: contain; margin: 0 auto 18px;
  }
  .title { font-size: 28px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; text-align: center; color: var(--text); margin: 0 0 16px; }
  .fields { width: 320px; max-width: 100%; }
  input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--text);
    padding: 10px 9px; border-radius: 4px; font-family: inherit; font-size: 15px; margin: 0 0 8px;
  }
  input::placeholder { color: #a3aabb; opacity: 1; }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%; margin-top: 24px; background: #2a3550; color: #fff; border: 1px solid var(--accent);
    padding: 11px 14px; border-radius: 4px; cursor: pointer; font-family: inherit;
    font-size: 14px; font-weight: 600;
  }
  button:hover { background: #34426a; border-color: var(--accent-hover); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #error { color: var(--bad); font-size: 13px; margin-top: 12px; min-height: 16px; text-align: center; }
</style>
</head>

  <div class="title">Diagnostic Board</div>
  <div class="fields">
    <input id="f-user" type="text" name="username" placeholder="Benutzername" aria-label="Benutzername" autocomplete="username" required autofocus>
    <input id="f-pass" type="password" name="password" placeholder="Passwort" aria-label="Passwort" autocomplete="current-password" required>
    <button type="submit" id="btn-login">Anmelden</button>
    <div id="error"></div>
  </div>
</form>
<script>
(function(){var l=document.createElement('link');l.rel='icon';l.href=document.querySelector('.logo').src;document.head.appendChild(l);})();
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn-login');
  const err = document.getElementById('error');
  err.textContent = '';
  btn.disabled = true;
  try {
    const res = await fetch('login', { method: 'POST', body: new FormData(e.target) });
    if (res.ok) {
      window.location.href = './';
      return;
    }
    const data = await res.json().catch(() => ({}));
    err.textContent = data.error || 'Anmeldung fehlgeschlagen.';
  } catch (e2) {
    err.textContent = 'Verbindung fehlgeschlagen.';
  } finally {
    btn.disabled = false;
  }
});
</script>
