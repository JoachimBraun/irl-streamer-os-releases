# IRL Streamer OS (V1.107): virtuelles Ausgabegeraet fuer den Guacamole-Ton.
# GNOME Remote Desktop leitet nur Ton weiter, der auf einem Ausgabegeraet
# (Audio/Sink) landet. Rechner ohne Lautsprecher/Soundkarte (z.B. VMs, Mini-PCs
# ohne Audio-Chip) haetten sonst keins - und damit keinen Ton im Browser.
# Niedrige Prioritaet: echte Geraete (HDMI, Klinke, USB) bleiben Standard,
# dieses Geraet springt nur ein, wenn es kein echtes gibt.
context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "irl-fernzugriff-ton"
            node.description = "Fernzugriff-Ton (ohne Lautsprecher)"
            media.class      = "Audio/Sink"
            audio.position   = "FL,FR"
            priority.session = 1
            priority.driver  = 1
        }
    }
]
